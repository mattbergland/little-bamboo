name: LittleBamboo
options:
  bundleIdPrefix: land.mattberg
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  LittleBamboo:
    type: application
    platform: iOS
    sources: [LittleBamboo]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: land.mattberg.littlebamboo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Little Bamboo
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: [LittleBambooTests]
      gatherCoverageData: true
  LittleBambooTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LittleBambooTests]
    dependencies:
      - target: LittleBamboo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
